# Improved Multi-Perspective Framing Queries
# Rewritten to maximize semantic asymmetry and ideological valence

queries:
  justification_israeli_military:
    hypothesis: "This text justifies Israeli military escalation as necessary defense"
    description: "Pro-Israel justification frame"
    
  condemnation_israeli_military:
    hypothesis: "This text condemns Israeli military escalation as unjustified aggression"
    description: "Anti-Israel condemnation frame"
    
  justification_palestinian_resistance:
    hypothesis: "This text justifies Palestinian armed resistance as legitimate struggle"
    description: "Pro-Palestinian justification frame"
    
  condemnation_palestinian_violence:
    hypothesis: "This text condemns Palestinian armed attacks as terrorist acts"
    description: "Anti-Palestinian condemnation frame"
    
  civilian_deaths_deliberate:
    hypothesis: "This text portrays civilian casualties as deliberate war crimes"
    description: "Deliberate targeting frame"
    
  civilian_deaths_unavoidable:
    hypothesis: "This text portrays civilian casualties as tragic but unavoidable"
    description: "Collateral damage frame"
    
  occupation_cause:
    hypothesis: "This text identifies Israeli occupation as the root cause of violence"
    description: "Occupation as primary cause frame"
    
  terrorism_cause:
    hypothesis: "This text identifies Hamas terrorism as the root cause of violence"
    description: "Terrorism as primary cause frame"

# These queries:
# 1. Break structural symmetry (different verbs, different syntax)
# 2. Add ideological valence (justifies/condemns, legitimate/terrorist)
# 3. Maximize semantic distance between pairs
# 4. Make each query a complete ideological stance, not just attribution
